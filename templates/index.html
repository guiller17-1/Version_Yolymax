<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .product-card { transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-4px); }
        .cart-badge { position: absolute; top: -5px; right: -5px; }
    </style>
</head>
<body class="bg-light">

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-shop me-2"></i>Mi Catálogo</a>
            <button class="btn btn-primary position-relative" data-bs-toggle="modal" data-bs-target="#cartModal">
                <i class="bi bi-cart3 me-1"></i> Carrito
                <span id="cartCount" class="badge bg-danger rounded-pill cart-badge">0</span>
            </button>
        </div>
    </nav>

    <!-- Header Banner -->
    <header class="bg-white border-bottom py-4 mb-4 text-center">
        <div class="container">
            <h1 class="h3 fw-bold">Productos Disponibles</h1>
            <p class="text-muted mb-0">Selecciona tus productos y realiza tu pedido en línea.</p>
        </div>
    </header>

    <!-- Lista de Productos -->
    <main class="container mb-5">
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Cargando catálogo de productos...</p>
        </div>
        <div id="productList" class="row row-cols-1 row-cols-md-3 g-4 d-none"></div>
    </main>

    <!-- Modal Carrito -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="bi bi-cart-check me-2"></i>Tu Carrito de Compras</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="cartItemsContainer">
                        <p class="text-muted text-center py-4">El carrito está vacío.</p>
                    </div>
                    <div id="orderForm" class="d-none border-top pt-3 mt-3">
                        <h6 class="fw-bold mb-3">Datos del Comprador</h6>
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo *</label>
                            <input type="text" id="custName" class="form-control" placeholder="Ej: Juan Pérez">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono Celular (Perú) *</label>
                            <input type="tel" id="custPhone" class="form-control" placeholder="Ej: 987654321" maxlength="9">
                        </div>
                        <div id="modalAlert" class="alert alert-danger d-none"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div class="me-auto h5 mb-0 fw-bold">Total: S/ <span id="cartTotal">0.00</span></div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" id="btnSubmitOrder" class="btn btn-success d-none" onclick="processOrder()">Confirmar Pedido</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let products = [];
        let cart = {};

        async function fetchProducts() {
            try {
                const res = await fetch('/api/productos');
                products = await res.json();
                renderProducts();
            } catch (err) {
                alert('Error al cargar los productos');
            }
        }

        function renderProducts() {
            const container = document.getElementById('productList');
            document.getElementById('loading').classList.add('d-none');
            container.classList.remove('d-none');
            container.innerHTML = '';

            products.forEach(p => {
                const stockAgotado = p.stock_disponible <= 0;
                container.innerHTML += `
                    <div class="col">
                        <div class="card h-100 shadow-sm product-card">
                            <img src="${p.imagen}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="${p.nombre}">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title h6 fw-bold">${p.nombre}</h5>
                                <p class="card-text text-muted small flex-grow-1">${p.descripcion}</p>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="fs-5 fw-bold text-primary">S/ ${p.precio.toFixed(2)}</span>
                                    <span class="badge ${stockAgotado ? 'bg-danger' : 'bg-success'}">
                                        ${stockAgotado ? 'Agotado' : 'Stock: ' + p.stock_disponible}
                                    </span>
                                </div>
                                <button class="btn btn-outline-primary w-100" ${stockAgotado ? 'disabled' : ''} onclick="addToCart('${p.id}')">
                                    <i class="bi bi-cart-plus me-1"></i> Agregar al Carrito
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(pId) {
            const p = products.find(prod => prod.id === pId);
            if (!p) return;
            const currentQty = cart[pId] ? cart[pId].quantity : 0;
            if (currentQty + 1 > p.stock_disponible) {
                alert('Ha alcanzado el stock máximo disponible de este producto.');
                return;
            }
            cart[pId] = { product: p, quantity: currentQty + 1 };
            updateCartUI();
        }

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;
            const container = document.getElementById('cartItemsContainer');
            const items = Object.values(cart);

            if (items.length === 0) {
                container.innerHTML = '<p class="text-muted text-center py-4">El carrito está vacío.</p>';
                document.getElementById('orderForm').classList.add('d-none');
                document.getElementById('btnSubmitOrder').classList.add('d-none');
            } else {
                let html = '<ul class="list-group mb-3">';
                items.forEach(item => {
                    const sub = item.product.precio * item.quantity;
                    totalCount += item.quantity;
                    totalPrice += sub;
                    html += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-0">${item.product.nombre}</h6>
                                <small class="text-muted">S/ ${item.product.precio.toFixed(2)} x ${item.quantity}</small>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="fw-bold">S/ ${sub.toFixed(2)}</span>
                                <button class="btn btn-sm btn-outline-danger" onclick="removeFromCart('${item.product.id}')"><i class="bi bi-trash"></i></button>
                            </div>
                        </li>
                    `;
                });
                html += '</ul>';
                container.innerHTML = html;
                document.getElementById('orderForm').classList.remove('d-none');
                document.getElementById('btnSubmitOrder').classList.remove('d-none');
            }

            document.getElementById('cartCount').innerText = totalCount;
            document.getElementById('cartTotal').innerText = totalPrice.toFixed(2);
        }

        function removeFromCart(pId) {
            delete cart[pId];
            updateCartUI();
        }

        async function processOrder() {
            const alertBox = document.getElementById('modalAlert');
            alertBox.classList.add('d-none');

            const nombre = document.getElementById('custName').value.trim();
            const telefono = document.getElementById('custPhone').value.trim();

            const itemsPayload = Object.values(cart).map(i => ({
                product_id: i.product.id,
                quantity: i.quantity
            }));

            try {
                const res = await fetch('/api/pedidos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, telefono, items: itemsPayload })
                });

                const data = await res.json();
                if (!res.ok) {
                    alertBox.innerText = data.error || 'Error al procesar el pedido';
                    alertBox.classList.remove('d-none');
                    return;
                }

                alert(`¡Pedido Registrado con Éxito!\n\nCódigo de Pedido: ${data.codigo}`);
                cart = {};
                updateCartUI();
                bootstrap.Modal.getInstance(document.getElementById('cartModal')).hide();
                fetchProducts();
            } catch (e) {
                alertBox.innerText = 'Error de conexión con el servidor.';
                alertBox.classList.remove('d-none');
            }
        }

        fetchProducts();
    </script>
</body>
</html>
